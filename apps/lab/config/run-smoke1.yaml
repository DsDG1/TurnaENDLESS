# 产物写到 runs/<run_id>/，反复试跑前先删掉该目录。
run_id: smoke-real-01
director: two-stage
world_state: true
trope_ledger: true
encoding: yaml
derive: false
showrunner_tier: fast
persona: P1
batches: 1
seed: 42
feedback_lag: 2
strategy: S-B
llm: real
stub_script: null
