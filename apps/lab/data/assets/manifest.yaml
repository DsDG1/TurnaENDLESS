# 素材清单（第 5.9.3 节）：Fluent Emoji Flat 风格选角的种子子集。
# 正式版从 microsoft/fluentui-emoji 元数据生成约 600 个（oss-reuse 待核实项 1）；
# 种子版手工收录渲染所需的 Unicode 字形（glyph）与英文标签。
# backgrounds 声明每个背景标签与它的具名位置表（位置名不显示给用户）。
# aliases（A2）：人事先声明的等价关系，只用于「解析需求清单」与 autofix 的别名替换，
# 不改变渲染名字。模型爱写的口语名字放这里，比在提示词里列反例有效（结果 §5 #11）。
emojis:
  - {name: duck, glyph: "🦆", tags: [duck, bird, animal, character]}
  - {name: cat, glyph: "🐱", tags: [cat, animal, character, pet]}
  - {name: moon, glyph: "🌙", tags: [moon, night, sky, character]}
