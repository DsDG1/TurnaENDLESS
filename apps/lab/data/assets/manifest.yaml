# 背景标签 → 一张背景描述 + 具名位置表（hidden_object 的 spots 白名单）
backgrounds:
  - tag: agency_office
    emoji: door
    description: 侦探事务所：一张桌子、一扇门、一个柜子和一盆植物
    spots: [desk_top, door_behind, shelf_top, plant_under, bin_under]
    aliases: [office, agency, detective_office]
  - tag: living_room
    emoji: sofa
    description: 客厅：沙发、小桌、台灯和置物架
    spots: [sofa_behind, table_under, lamp_top, shelf_top]
    # Apartment 7 是 duck_detective 圣经 premise 里的说法，而清单里只有 living_room（A3）
    aliases: [apartment, flat, home, room]
  - tag: rooftop
    emoji: roof
    description: 屋顶：水塔、烟囱和一排盆栽
    spots: [tank_behind, chimney_top, plant_under, drain_under]
    aliases: [roof, roof_top]
  - tag: shop_counter
    emoji: counter
    description: 商店柜台：柜台、货架、抽屉和橱窗
    spots: [counter_top, shelf_under, drawer_in, window_top]
    aliases: [counter, shop, store]
  - tag: stockroom
    emoji: box
    description: 库房：成排的箱子和一只高梯子
    spots: [box_behind, ladder_top, crate_under, shelf_top]
    aliases: [storage, back_room]
  - tag: shop_window
    emoji: window
    description: 橱窗：玻璃、展示台和价签
    spots: [glass_front, display_top, tag_under, sill_top]
    aliases: [window, shopfront]
