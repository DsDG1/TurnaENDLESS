# A1–A2 学习词库（实验 0 种子版，第 5.1 节）
#
# 规模说明：方案目标是约 300 条（220 词义 + 50 词块 + 30 句型）。
# 本文件是「实验建设」阶段的种子版，扩过一轮后共 143 条（106 词义 + 22 词块 + 15 句型）。
# 第一版只有 62 条，20k–20n 的 W-OOV 明细（411 个生词）暴露了覆盖缺口，这一轮按跑批数据补：
# 商店/侦探线真实高频出现的名词（coin / jar / label / parcel / counter / courier…）、
# 高频动词（ask / wait / try / check / hide / arrive…）、高频形容词（right / wrong / quiet / strange…），
# 外加 8 个词块与 5 个句型（现在进行时 / be going to / 比较级 / 所有格 / because 从句）。
# 离 300 条还有距离：剩下的是低频词，继续按 OOV 数据补，不再凭感觉堆。
# 扩到 300 条的流程见 docs/experiments/exp-00-director-loop.md 第 8 节 Day 1–2：
# CEFR-J A1–A2 底表 + compromise 生成 forms + 人工复核 + 补 confusables 与中文释义。
#
# 字段规范见 packages/learning/src/lexicon.ts（Zod 校验）与方案第 5.1 节。

