# promptfoo 回归矩阵（实验方案第 8 节 Day 8）：「提示词 × 模型」小矩阵。
#
# 断言不重写规则，直接调用 packages/esl 的校验器：assertions/esl-assert.js 把模型输出
# 通过 stdin 交给 `pnpm lab assert`，退出码非 0 即判失败（见该文件顶部说明）。
#
# 使用：
#   1. npm i -g promptfoo
#   2. $env:ENDLESS_API_KEY = "..."   # 变量名与 config/models.yaml 的 api_key_env 一致
#   3. cd apps/lab/promptfoo && promptfoo eval
#   4. promptfoo view
#
# 矩阵扩法：往 prompts 里加提示词文件、往 providers 里加模型（同一模型要不同 label 时
# 用 `label:` 区分），tests 里的每条 = 一批的上下文样例。正式矩阵「每格 20 批」时把
# tests 扩到 20 条（或从 runs/<run_id>/batches 里抽真实上下文回填 vars）。

description: 'ENDLESS ESL 回归（exp-00 Day 8：提示词 × 模型）'

prompts:
  - file://../data/prompts/single.md

# providers 走自定义 provider（provider.js）：直连 MiniMax 的 OpenAI 兼容端点，按 lab 的
# 方式带 reasoning_effort: low。0.124 的 `openai:chat:` provider 不透传该参数，8192 的
# 上限会被思考 token 吃光（10 条用例全 finish=length），适配差异挡在矩阵之外。
# 若换回官方 OpenAI 端点，把 id 改回 `openai:chat:<model>` 并删掉 reasoning_effort 即可。
providers:
  - id: file://provider.js
    label: fast/MiniMax-M3.1-Flash
    config:
      model: MiniMax-M3.1-Flash
      base_url: https://api.minimax.cn/v1
      api_key_env: ENDLESS_API_KEY
      temperature: 0.8
      max_tokens: 8192
      reasoning_effort: low
  - id: file://provider.js
    label: premium/MiniMax-M3
    config:
      model: MiniMax-M3
      base_url: https://api.minimax.cn/v1
      api_key_env: ENDLESS_API_KEY
      temperature: 0.8
      max_tokens: 8192
      reasoning_effort: low
      # M3 把思考内联进 content，只能整段关掉，否则 5/5 条都是 E-PARSE
      thinking: disabled

defaultTest:
  assert:
    - type: javascript
      value: file://esl-assert.js
  vars:
    # single.md 的占位符：全部要给值，否则模型会照着占位符抄
    learner_profile: |
      P1「通勤刷手机」：A1，喜欢悬疑和冷幽默，讨厌说教；每天 12 分钟，一次连续刷 8–12 张。
    trope_ledger: '（空：本次是冷启动，没有任何梗用过）'
    feedback: '（暂无：第一批）'
    callback: 'null（本批是第一频道的第一批，没有可回调的候选）'
    open_threads: '（无）'
    recent_summary: '（暂无摘要）'
    char_specs: |
      duck: {role: 侦探, tone: 冷面, sentence: 短句, base: '@emoji:duck', expr: [neutral, happy, suspicious, smug, nervous, shocked, sad], hat: [none, detective, crown, chef], props_allowed: [magnifying_glass, notebook, coffee]}
      cat: {role: 邻居, tone: 话多, sentence: 中句, base: '@emoji:cat', expr: [neutral, happy, suspicious, nervous, sweating, shocked, sad], hat: [none, crown, cap], props_allowed: [sock, cheese]}
      moon: {role: 委托人, tone: 自恋, sentence: 中句, base: '@emoji:moon', expr: [neutral, happy, vain, sad, shocked, suspicious], hat: [none, crown, top], props_allowed: [top_hat, mirror]}
      shopkeeper: {role: 店主, tone: 面无表情, sentence: 短句, base: '@emoji:badger', expr: [neutral, happy, polite, suspicious, nervous, shocked], hat: [none, cap], props_allowed: [price_tag, notebook, shopping_cart]}
      delivery_mouse: {role: 送货员, tone: 慌张, sentence: 短句, base: '@emoji:mouse', expr: [neutral, tired, nervous, shocked, happy], hat: [none, cap], props_allowed: [box, envelope, watch]}
    # 必须是 data/assets/manifest.yaml 里真实存在的背景标签与 emoji 名：
    # 背景只有 6 个（agency_office/living_room/rooftop/shop_counter/stockroom/shop_window），
    # `@tag:street` 这种写不存在的标签会直接 E-ASSET-MISSING；`hat` 是 tag 不是 emoji 名，
    # 要用 top_hat / cap / crown。
    asset_tags: 'agency_office, living_room, rooftop, shop_counter, stockroom, shop_window, duck, cat, moon, badger, mouse, person, top_hat, cap, crown, sock, key, box, bag, umbrella, magnifying_glass, notebook, coffee, coin, money_bag, cheese, price_tag, shopping_cart, door, sofa, table, lamp, mirror, newspaper, envelope, watch, plant, clock'
    # v9 起 single.md 有 {{backgrounds}}：6 个背景标签 + 位置白名单（与 manifest 一致）
    backgrounds: |
      @tag:agency_office（侦探事务所：一张桌子、一扇门、一个柜子和一盆植物；spots: desk_top / door_behind / shelf_top / plant_under / bin_under）
      @tag:living_room（客厅：沙发、小桌、台灯和置物架；spots: sofa_behind / table_under / lamp_top / shelf_top）
      @tag:rooftop（屋顶：水塔、烟囱和一排盆栽；spots: tank_behind / chimney_top / plant_under / drain_under）
      @tag:shop_counter（商店柜台：柜台、货架、抽屉和橱窗；spots: counter_top / shelf_under / drawer_in / window_top）
      @tag:stockroom（库房：成排的箱子和一只高梯子；spots: box_behind / ladder_top / crate_under / shelf_top）
      @tag:shop_window（橱窗：玻璃、展示台和价签；spots: glass_front / display_top / tag_under / sill_top）
    # 首轮没有上一批的问题单；空串而不是省略，否则模型会看到字面量 {{retry_note}}
    retry_note: ''
    # 冷启动 A1 的真实允许词表由 promptfoo/render-vars.ts 算出；这里放的是五条样例的并集
    # （每格多几十个对它的 brief 而言是 OOV 的词，OOV 判定因此略宽松，结构类断言不受影响）
    allowed_words: |-
      a, about, again, ah, all, also, always, am, an, and, any, are, aren't, at, back, bad, be, because, been, behind, being, big, box, but, by, came, can, can you, can't, cheap, cheaper, cheapest, clue, coin, come, comes, coming, could, could you, day, days, did, didn't, different, do, do you have, does, does he have, does she have, doesn't, doing, don't, door, down, everything, expensive, few, first, five, for, four, friday, from, go, goes, going, good, had, has, hat, have, having, he, he's, hello, help, helped, helps, her, here, hey, hi, him, his, hmm, how, how many, how much, i, i'm, i've, if, in, into, is, isn't, it, it's, its, just, key, keys, knew, know, knows, last, let's, like, liked, likes, little, long, look, looked, looks, lot, many, may, me, might, mine, monday, money, moon, more, more expensive, morning, most, most expensive, much, must, my, myself, need, needed, needs, never, new, night, no, not, nothing, now, off, oh, ok, okay, old, on, one, only, onto, or, other, our, out, over, please, price, really, said, same, sat, saturday, saw, say, says, see, seen, sees, shall, she, she's, short, should, sit, sits, small, so, sofa, some, something, sunday, table, than, thanks, that, that's, the, their, them, then, there, these, they, they're, they've, thing, things, think, thinks, this, those, thought, three, thursday, to, today, tomorrow, tonight, too, tuesday, two, umbrella, under, up, us, very, want, wanted, wants, was, wasn't, we, we're, we've, wednesday, week, well, went, were, weren't, what, what's, when, where, where are, where is, where was, where were, where's, which, who, who's, whom, whose, why, will, with, won't, would, yes, yesterday, you, you're, you've, your, yours, yourself
    max_words_per_line: '9'

tests:
  - description: 'duck_detective / A1 / 位置介词暴露'
    vars:
      channel: duck_detective
      channel_bible: |
        频道：鸭子侦探社（duck_detective）。单元剧，每批一个小案子，结尾留一个钩子。
        固定角色：duck（侦探）、cat（邻居）、moon（委托人）。常驻地点：agency_office、living_room、rooftop。
        语气：冷面幽默，台词短。禁止血腥与说教。
      brief: |
        brief: lb-0001
        level: A1
        introduce: []
        expose:
          - {item: 'lx:behind#prep.location', exposures_so_far: 0, need: 2}
          - {item: 'lx:under#prep.location', exposures_so_far: 0, need: 2}
        review: []
        vocab: {allowed_extra: [hat, table, door, clue], max_words_per_line: 9, oov_budget: 0.02}
        avoid_before_test: []
      # 学习任务清单：与流水线给的分场清单同规则（曝光写 uses、检测写 evidence）
      learning_checklist: |
        - lx:behind#prep.location：曝光 → 写进某个场景的 uses，不要写 evidence
        - lx:under#prep.location：曝光 → 写进某个场景的 uses，不要写 evidence
      cast_facts: 'duck role detective (canon)；cat role assistant (canon)'
      allowed_extra: 'hat, table, door, clue'
  - description: 'duck_detective / A1 / 到期复习（ck:where-is）'
    vars:
      channel: duck_detective
      channel_bible: |
        频道：鸭子侦探社（duck_detective）。单元剧，每批一个小案子，结尾留一个钩子。
        固定角色：duck（侦探）、cat（邻居）、moon（委托人）。常驻地点：agency_office、living_room、rooftop。
        语气：冷面幽默，台词短。禁止血腥与说教。
      brief: |
        brief: lb-0002
        level: A1
        introduce: []
        expose: [{item: 'lx:key#n.opener', exposures_so_far: 1, need: 2}]
        review: [{item: 'ck:where-is', facet: meaning, min_evidence: recognition-4}]
        vocab: {allowed_extra: [hat, table, door, key], max_words_per_line: 9, oov_budget: 0.02}
        avoid_before_test: [where is, where's, where are]
      # 学习任务清单：与流水线给的分场清单同规则（曝光写 uses、检测写 evidence）
      learning_checklist: |
        - lx:key#n.opener：曝光 → 写进某个场景的 uses，不要写 evidence
        - ck:where-is：检测 → 写 evidence: {item: ck:where-is, type: recognition-4}
      cast_facts: 'duck role detective (canon)；cat role assistant (canon)'
      allowed_extra: 'hat, table, door, key'
      open_threads: 't-clue：谁拿走了钥匙（优先级 2）'
  - description: 'impossible_store / A1 / 价格词块'
    vars:
      channel: impossible_store
      channel_bible: |
        频道：不可能商店（impossible_store）。每批一个「卖不可能之物」的顾客。
        固定角色：shopkeeper（店主）、delivery_mouse（送货鼠）。地点：shop_counter、stockroom、shop_window。
        语气：荒诞、礼貌、面无表情。价格永远离谱。
      brief: |
        brief: lb-0003
        level: A1
        introduce: []
        expose:
          - {item: 'ck:how-much', exposures_so_far: 0, need: 2}
          - {item: 'lx:expensive#adj.costly', exposures_so_far: 0, need: 2}
        review: []
        vocab: {allowed_extra: [price, money, coin, hat], max_words_per_line: 9, oov_budget: 0.02}
        avoid_before_test: []
      # 学习任务清单：与流水线给的分场清单同规则（曝光写 uses、检测写 evidence）
      learning_checklist: |
        - ck:how-much：曝光 → 写进某个场景的 uses，不要写 evidence
        - lx:expensive#adj.costly：曝光 → 写进某个场景的 uses，不要写 evidence
      cast_facts: 'shopkeeper role owner (canon)；delivery_mouse role courier (canon)'
      allowed_extra: 'price, money, coin, hat'
  - description: 'impossible_store / A2 / 到期复习（ck:how-much）'
    vars:
      channel: impossible_store
      channel_bible: |
        频道：不可能商店（impossible_store）。每批一个「卖不可能之物」的顾客。
        固定角色：shopkeeper（店主）、delivery_mouse（送货鼠）。地点：shop_counter、stockroom、shop_window。
        语气：荒诞、礼貌、面无表情。价格永远离谱。
      brief: |
        brief: lb-0004
        level: A2
        introduce: [{item: 'lx:borrow#v.take-temporarily'}]
        expose: [{item: 'lx:cheap#adj.inexpensive', exposures_so_far: 1, need: 2}]
        review: [{item: 'ck:how-much', facet: meaning, min_evidence: recognition-4}]
        vocab: {allowed_extra: [price, money, umbrella, box], max_words_per_line: 10, oov_budget: 0.02}
        avoid_before_test: [how much, how many]
      # 学习任务清单：与流水线给的分场清单同规则（曝光写 uses、检测写 evidence）
      learning_checklist: |
        - lx:cheap#adj.inexpensive：曝光 → 写进某个场景的 uses，不要写 evidence
        - ck:how-much：检测 → 写 evidence: {item: ck:how-much, type: recognition-4}
      cast_facts: 'shopkeeper role owner (canon)；delivery_mouse role courier (canon)'
      allowed_extra: 'price, money, umbrella, box'
  - description: 'improv / A1 / 纯暴露（无检测）'
    vars:
      channel: improv
      channel_bible: |
        频道：即兴（improv）。没有固定角色，每批换一个日常场景（living_room、rooftop、shop_window）。
        语气：生活化、轻喜剧。画面用 emoji 与素材标签表达。
      brief: |
        brief: lb-0005
        level: A1
        introduce: []
        expose:
          - {item: 'ck:can-you', exposures_so_far: 0, need: 2}
          - {item: 'ck:do-you-have', exposures_so_far: 0, need: 2}
        review: []
        vocab: {allowed_extra: [hat, sofa, table, moon], max_words_per_line: 9, oov_budget: 0.02}
        avoid_before_test: []
      # 学习任务清单：与流水线给的分场清单同规则（曝光写 uses、检测写 evidence）
      learning_checklist: |
        - ck:can-you：曝光 → 写进某个场景的 uses，不要写 evidence
        - ck:do-you-have：曝光 → 写进某个场景的 uses，不要写 evidence
      cast_facts: '（无固定角色：本频道每批自选日常场景）'
      allowed_extra: 'hat, sofa, table, moon'
